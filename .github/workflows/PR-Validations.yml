name: PR Validation - Maven Package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Ejecutar comandos por defecto dentro de la carpeta del módulo Pontiland
defaults:
  run:
    working-directory: Pontiland

# Permisos necesarios para publicar anotaciones/reports
permissions: write-all

jobs:
  # -------------
  # Job: setup
  # Se encarga de checkout, configuración de JDK y cache de Maven.
  # Los demás jobs usan 'needs: setup' para garantizar que el entorno base esté disponible.
  setup:
    name: Preparación
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'jetbrains'

      - name: Cachear dependencias Maven
        uses: actions/cache@v4
        id: cache-m2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('Pontiland/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

  # -------------
  # Job: build
  # Compila y empaqueta el proyecto (sin tests) y sube el artefacto.
  build:
    name: Compilar y empaquetar
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'jetbrains'

      - name: Compilar y empaquetar (sin tests)
        run: mvn --batch-mode -DskipTests clean package --no-transfer-progress

      - name: Subir artefacto de build
        uses: actions/upload-artifact@v4
        with:
          name: pontiland-artifact
          path: Pontiland/target/*.jar

  # -------------
  # Job: test
  # Ejecuta la suite de tests y genera informe JaCoCo.
  test:
    name: Tests y cobertura
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'jetbrains'

      - name: Ejecutar tests y generar JaCoCo
        run: mvn --batch-mode test jacoco:report --no-transfer-progress

      - name: Subir informes de tests (surefire)
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: Pontiland/target/surefire-reports/**

      - name: Subir informe JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: Pontiland/target/site/jacoco/**

  # -------------
  # Job: formatting
  # Verifica el formateo con Spotless (puede ejecutarse en paralelo).
  formatting:
    name: Verificar formato (Spotless)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'jetbrains'

      - name: Ejecutar Spotless
        run: mvn --batch-mode spotless:check --no-transfer-progress

  # -------------
  # Job: checkstyle
  # Ejecuta Checkstyle y sube el resultado para reportes.
  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'jetbrains'

      - name: Ejecutar Checkstyle
        run: mvn --batch-mode checkstyle:check --no-transfer-progress

      - name: Subir resultado de Checkstyle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-result
          path: Pontiland/target/checkstyle-result.xml

  # -------------
  # Job: spotbugs
  # Ejecuta SpotBugs y sube el XML para anotaciones.
  spotbugs:
    name: SpotBugs
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'jetbrains'

      - name: Ejecutar SpotBugs
        run: mvn --batch-mode verify -DskipTests --no-transfer-progress

      - name: Subir XML de SpotBugs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-xml
          path: Pontiland/target/spotbugsXml.xml

  # -------------
  # Job: sonar
  # Analiza con SonarQube/SonarCloud (solo si está configurado SONAR_TOKEN).
  sonar:
    name: Sonar
    runs-on: ubuntu-latest
    needs: build
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'jetbrains'

      - name: Ejecutar SonarQube/SonarCloud
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=Samu-Kiss_UNI-25-03-NullPointerException

  # -------------
  # Job: reports
  # Agrupa las tareas de publicación de reportes. Se ejecuta siempre (if: always())
  # para que los reportes estén disponibles aunque fallen jobs previos.
  reports:
    name: Publicar reportes
    runs-on: ubuntu-latest
    needs: [test, checkstyle, spotbugs]
    if: always()
    steps:
      - name: Descargar informes de tests
        uses: actions/download-artifact@v4
        with:
          name: surefire-reports

      - name: Publicar informe de JUnit
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: 'Pontiland/target/surefire-reports/TEST-*.xml'

      - name: Descargar informe JaCoCo
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report

      - name: Informe de cobertura JaCoCo
        uses: PavanMudigonda/jacoco-reporter@v4.8
        if: always()
        with:
          coverage_results_path: Pontiland/target/site/jacoco/jacoco.xml
          coverage_report_name: JaCoCo Coverage
          coverage_report_title: JaCoCo Coverage
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_only_summary: false
          skip_check_run: false
          minimum_coverage: 0
          fail_below_threshold: false

      - name: Descargar resultado Checkstyle
        uses: actions/download-artifact@v4
        with:
          name: checkstyle-result

      - name: Reporte de Checkstyle (anotaciones)
        uses: jwgmeligmeyling/checkstyle-github-action@v1
        if: always()
        with:
          path: Pontiland/target/checkstyle-result.xml
          name: Checkstyle Report
          title: Checkstyle Annotations
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar SpotBugs XML
        uses: actions/download-artifact@v4
        with:
          name: spotbugs-xml

      - name: Reporte de SpotBugs (anotaciones)
        uses: jwgmeligmeyling/spotbugs-github-action@v1
        if: always()
        with:
          path: Pontiland/target/spotbugsXml.xml
          name: SpotBugs Report
          title: SpotBugs Annotations
          token: ${{ secrets.GITHUB_TOKEN }}
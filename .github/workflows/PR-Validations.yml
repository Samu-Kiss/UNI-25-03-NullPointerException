name: PR Validation - Maven Package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

defaults:
  run:
    working-directory: Pontiland

jobs:
  build:

    runs-on: ubuntu-latest
      
    permissions: write-all

    steps:
    
    # ------------------------------------
    # Step 01: Checkout de la última versión del código
    # Asegura que el workflow trabaja con la referencia del commit del PR/push.
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

    # ------------------------------------
    # Step 02: Configuración de JDK 21
    # Instala y configura la versión exacta de Java requerida por el proyecto.
    - name: Set Up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'jetbrains'

    # ------------------------------------
    # Step 03: Cache de dependencias Maven
    # Restaura y guarda el repositorio local Maven para acelerar builds repetidos.
    - name: Cache Maven Packages
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('Pontiland/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    # ------------------------------------
    # Step 04: Compilar y empaquetar el proyecto con Maven
    # Compila el código fuente y genera el artefacto sin ejecutar pruebas.
    - name: Build with Maven
      run: mvn --batch-mode -DskipTests clean package --no-transfer-progress

    # ------------------------------------
    # Step 05: Ejecutar pruebas y generar cobertura (JUnit + JaCoCo)
    # Corre la suite de tests unitarios y produce el reporte de cobertura.
    - name: Run Tests with Maven (JaCoCo)
      run: mvn --batch-mode test jacoco:report --no-transfer-progress

    # ------------------------------------
    # Step 06: Verificar formato con Spotless
    # Valida que el código esté formateado según las reglas definidas por Spotless.
    - name: Run Spotless Check
      run: mvn --batch-mode spotless:check --no-transfer-progress

    # ------------------------------------
    # Step 07: Linter con Checkstyle
    # Ejecuta Checkstyle con la configuración del proyecto y falla ante violaciones.
    - name: Run Checkstyle
      run: mvn --batch-mode checkstyle:check --no-transfer-progress

    # ------------------------------------
    # Step 08: Análisis estático con SpotBugs
    # Ejecuta SpotBugs en modo verificación para detectar defectos potenciales.
    - name: Run SpotBugs
      run: mvn --batch-mode verify -DskipTests --no-transfer-progress

    # ------------------------------------
    # Cache Sonar packages
    - name: Cache SonarQube packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    # ------------------------------------
    # Cache Maven packages
    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    # ------------------------------------
    # Build and analyze with Sonar (runs only if SONAR_TOKEN secret is set)
    # Uses the JDK already configured in the workflow (step 02)
    - name: Build and analyze (SonarQube / SonarCloud)
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=Samu-Kiss_UNI-25-03-NullPointerException

    ##################################################
    #                    REPORTES                    #
    ##################################################

    # ------------------------------------
    # Step 09: Generar reporte de pruebas
    # Publica los resultados de JUnit en la pestaña “Checks” aunque falle el build.
    - name: Test Report
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: 'Pontiland/target/surefire-reports/TEST-*.xml'

    # ------------------------------------
    # Step 10: Reporte de cobertura JaCoCo
    # Sube el informe de cobertura a GitHub como check dedicado.
    - name: JaCoCo Coverage Report
      uses: PavanMudigonda/jacoco-reporter@v4.8
      if: always()
      with:
        coverage_results_path: Pontiland/target/site/jacoco/jacoco.xml
        coverage_report_name: JaCoCo Coverage
        coverage_report_title: JaCoCo Coverage
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_only_summary: false
        skip_check_run: false
        minimum_coverage: 0
        fail_below_threshold: false

    # ------------------------------------
    # Step 11: Reporte de Checkstyle
    # Anota los hallazgos de Checkstyle directamente sobre el diff del PR.
    - name: Checkstyle Report
      uses: jwgmeligmeyling/checkstyle-github-action@v1
      if: always()
      with:
        path: Pontiland/target/checkstyle-result.xml
        name: Checkstyle Report
        title: Checkstyle Annotations
        token: ${{ secrets.GITHUB_TOKEN }}

    # ------------------------------------
    # Step 12: Reporte de SpotBugs
    # Publica las anotaciones de SpotBugs para revisar los avisos desde GitHub.
    - name: SpotBugs Report
      uses: jwgmeligmeyling/spotbugs-github-action@v1
      if: always()
      with:
        path: Pontiland/target/spotbugsXml.xml
        name: SpotBugs Report
        title: SpotBugs Annotations
        token: ${{ secrets.GITHUB_TOKEN }}
        
name: PR Validation - Maven Package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

defaults:
  run:
    working-directory: Pontiland

jobs:
  build:

    runs-on: ubuntu-latest
      
    permissions: write-all

    steps:
    
    #1. Checkout de la última versión del codigo
    - name: Checkout repository
      uses: actions/checkout@v4

    #2. Configuración de JDK 21
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'jetbrains'

    #3. Cache de dependencias Maven
    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('Pontiland/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    #4. Compilar y empaquetar el proyecto con Maven
    - name: Build with Maven
      run: mvn --batch-mode -DskipTests clean package --no-transfer-progress

    #5. Ejecutar pruebas y generar cobertura (JUnit + JaCoCo)
    - name: Run Tests with Maven (JaCoCo)
      run: mvn --batch-mode test jacoco:report --no-transfer-progress

    #6. Linter con Checkstyle
    - name: Run Checkstyle
      run: mvn --batch-mode checkstyle:check --no-transfer-progress

    #7. Análisis estático con SpotBugs
    - name: Run SpotBugs
      run: mvn --batch-mode verify -DskipTests --no-transfer-progress

    ###############
    #  REPORTES   #
    ###############

    #8. Generar reporte de pruebas
    - name: Test Report
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: 'Pontiland/target/surefire-reports/TEST-*.xml'

    #9. Reporte de cobertura JaCoCo
    - name: JaCoCo Coverage Report
      uses: PavanMudigonda/jacoco-reporter@v4.8
      if: always()
      with:
        coverage_results_path: Pontiland/target/site/jacoco/jacoco.xml
        coverage_report_name: JaCoCo Coverage
        coverage_report_title: JaCoCo Coverage
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_only_summary: false
        skip_check_run: false
        minimum_coverage: 0
        fail_below_threshold: false

    #10. Reporte de Checkstyle
    - name: Checkstyle Report
      uses: jwgmeligmeyling/checkstyle-github-action@v1
      if: always()
      with:
        path: Pontiland/target/checkstyle-result.xml
        name: Checkstyle Report
        title: Checkstyle Annotations
        token: ${{ secrets.GITHUB_TOKEN }}

    #11. Reporte de SpotBugs
    - name: SpotBugs Report
      uses: jwgmeligmeyling/spotbugs-github-action@v1
      if: always()
      with:
        path: Pontiland/target/spotbugsXml.xml
        name: SpotBugs Report
        title: SpotBugs Annotations
        token: ${{ secrets.GITHUB_TOKEN }}
